name: sticky_wall
description: "Sticky notes on a real pin-board: drag, pin, draw, and organize paper notes across textured walls."
# Not a pub.dev package.
publish_to: 'none'

# Version name + build number. Android: versionName / versionCode.
# iOS: CFBundleShortVersionString / CFBundleVersion. Bump the build number on
# every store upload; bump the version name for user-visible releases.
version: 1.6.3+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  # Local persistence (notes, boards, settings) — no backend.
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  # Reminders.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Share / save / pick images.
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  gal: ^2.3.3
  # Layout.
  flutter_staggered_grid_view: ^0.7.0
  # Platform integrations.
  home_widget: ^0.9.3
  receive_sharing_intent: ^1.9.0
  pdf: ^3.13.0
  file_picker: ^13.3.0
  # Voice notes: record (microphone → .m4a) and play back.
  record: ^7.1.2
  audioplayers: ^6.8.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  local_auth: ^3.0.2
  crypto: ^3.0.8
  http: ^1.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  msix: ^3.18.0

# App icon: generated from code by test/icon_gen_test.dart, then rasterised
# into every platform's launcher set with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#6B5849"
    theme_color: "#6B5849"

# Splash: same wall colour as the app's first frame so the hand-off is seamless.
flutter_native_splash:
  color: "#6B5849"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#6B5849"
    image: assets/icon/splash_logo.png

flutter:
  uses-material-design: true

  # Generate lib/l10n/app_localizations*.dart from the ARB files (see l10n.yaml).
  generate: true

  # Wall textures: CC0 from ambientCG — Cork004, PaintedPlaster017,
  # Concrete046, Bricks104, Planks021, Paper004, Marble012, Terrazzo013,
  # Fabric069, Fabric034 (recoloured), Fabric030.
  assets:
    - assets/images/
    - assets/manual/en/
    - assets/manual/vi/
    - assets/templates/
    - assets/stickers/

  # Fonts (SIL OFL, licenses in assets/fonts/). Every family bundled here
  # includes the Vietnamese subset — verified glyph by glyph before adding.
  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Itim
      fonts:
        - asset: assets/fonts/Itim-Regular.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
    - family: Sriracha
      fonts:
        - asset: assets/fonts/Sriracha-Regular.ttf
    - family: Mynerve
      fonts:
        - asset: assets/fonts/Mynerve-Regular.ttf
    - family: FuzzyBubbles
      fonts:
        - asset: assets/fonts/FuzzyBubbles-Regular.ttf
    - family: AmaticSC
      fonts:
        - asset: assets/fonts/AmaticSC-Regular.ttf
    - family: Charm
      fonts:
        - asset: assets/fonts/Charm-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
    # Sticky Wall Pro.
    - family: ShantellSans
      fonts:
        - asset: assets/fonts/ShantellSans-Regular.ttf
    - family: Coiny
      fonts:
        - asset: assets/fonts/Coiny-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
    - family: SedgwickAve
      fonts:
        - asset: assets/fonts/SedgwickAve-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf

# Windows: the Microsoft Store package, built with `dart run msix:create`.
# identity_name and publisher come from Partner Center → Sticky Wall →
# Product management → Product identity (Package/Identity/Name and
# Package/Identity/Publisher); fill them in before the first Store build.
# Pro is the Store add-on with Product ID `sticky_wall_pro` (Durable).
msix_config:
  display_name: Sticky Wall
  publisher_display_name: Winka Studio
  # identity_name: <Package/Identity/Name>
  # publisher: <Package/Identity/Publisher>
  msix_version: 1.6.3.0
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient, microphone
  languages: en-us, vi-vn
  store: true
